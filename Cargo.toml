[package]
name = "automatic-timezoned"
description = "Automatically update system timezone based on location"
version = "2.0.164"
edition = "2021"
repository = "https://github.com/maxbrunet/automatic-timezoned"
license = "GPL-3.0"
keywords = ["dbus", "geoclue", "systemd", "timezone", "zoneinfo"]

[dependencies]
env_logger = { version = "=0.11.11", default-features = false }
futures-util = { version = "=0.3.34", default-features = false }
log = { version = "=0.4.34", default-features = false }
tzf-rs = { version = "=2.1.3", default-features = false, features = ["bundled"] }

[dependencies.clap]
version = "=4.6.7"
default-features = false
features = [
  "derive",
  "env",
  "error-context",
  "help",
  "std",
  "usage",
]

[dependencies.zbus]
version = "=6.1.0"
default-features = false
features = [
  "default-rt",
  "proxy",
]

[dev-dependencies]
trycmd = "=1.2.1"

[profile.release]
lto = true
codegen-units = 1
