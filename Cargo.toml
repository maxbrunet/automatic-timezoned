[package]
name = "automatic-timezoned"
description = "Automatically update system timezone based on location"
version = "2.0.169"
edition = "2021"
rust-version = "1.89"
repository = "https://github.com/maxbrunet/automatic-timezoned"
license = "GPL-3.0-only"
keywords = ["dbus", "geoclue", "systemd", "timezone", "zoneinfo"]

[dependencies]
env_logger = { version = "=0.11.11", default-features = false }
futures-util = { version = "=0.3.34", default-features = false }
log = { version = "=0.4.35", default-features = false }
tzf-rs = { version = "=2.2.0", default-features = false, features = ["bundled"] }

[dependencies.clap]
version = "=4.6.7"
default-features = false
features = [
  "derive",
  "env",
  "error-context",
  "help",
  "std",
  "usage",
]

[dependencies.zbus]
version = "=6.2.1"
default-features = false
features = [
  "default-rt",
  "proxy",
]

[dev-dependencies]
trycmd = "=1.2.1"

[dev-dependencies.zbus]
version = "=6.2.1"
default-features = false
features = [
  "default-rt",
  "p2p",
  "proxy",
  "service",
]

[lints.rust]
unsafe_op_in_unsafe_fn = "warn"
missing_debug_implementations = "warn"
missing_docs = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

unwrap_used = "warn"
expect_used = "allow"
panic_in_result_fn = "warn"
missing_panics_doc = "warn"
missing_errors_doc = "warn"
missing_assert_message = "warn"

allow_attributes = "warn"
allow_attributes_without_reason = "warn"

undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"

fn_params_excessive_bools = "warn"
struct_excessive_bools = "warn"
clone_on_ref_ptr = "warn"
redundant_clone = "warn"
rc_buffer = "warn"

exhaustive_enums = "warn"

string_add = "warn"
wildcard_imports = "warn"

dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"
print_stderr = "warn"

as_conversions = "warn"
cast_possible_truncation = "warn"
cast_sign_loss = "warn"

module_name_repetitions = "allow"
must_use_candidate = "allow"
module_inception = "allow"
enum_glob_use = "allow"

[profile.release]
lto = true
codegen-units = 1
